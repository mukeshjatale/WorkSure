<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My bookings · WorkSure</title>
  <meta name="description" content="View, track, cancel and rate your home service bookings.">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-protected>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main" class="container section">
    <div class="dash-head">
      <div>
        <h1>My bookings</h1>
        <p>Filter by status. Each card has the actions that are available right now.</p>
      </div>
      <a class="btn btn-primary" href="services.html">Book another service</a>
    </div>

    <div class="chip-row" role="group" aria-label="Filter bookings by status">
      <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
      <button type="button" class="chip" data-filter="pending" aria-pressed="false">Pending</button>
      <button type="button" class="chip" data-filter="accepted" aria-pressed="false">Accepted</button>
      <button type="button" class="chip" data-filter="in_progress" aria-pressed="false">In progress</button>
      <button type="button" class="chip" data-filter="completed" aria-pressed="false">Completed</button>
      <button type="button" class="chip" data-filter="rejected" aria-pressed="false">Declined</button>
      <button type="button" class="chip" data-filter="cancelled" aria-pressed="false">Cancelled</button>
    </div>

    <div id="booking-list" class="booking-list mt-5" aria-live="polite"></div>
    <div id="pagination" class="pagination"></div>
  </main>

  <dialog id="detail-dialog" class="dialog" aria-labelledby="detail-title">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 id="detail-title">Booking details</h2>
        <form method="dialog"><button type="submit" class="icon-btn" aria-label="Close">&times;</button></form>
      </div>
      <div id="detail-body"></div>
    </div>
  </dialog>

  <dialog id="review-dialog" class="dialog" aria-labelledby="review-title">
    <form id="review-form" class="dialog-inner" novalidate>
      <div class="dialog-head">
        <h2 id="review-title">Rate your experience</h2>
        <button type="button" class="icon-btn" data-close-dialog aria-label="Close">&times;</button>
      </div>
      <p id="review-service" class="muted"></p>
      <fieldset>
        <legend>Your rating</legend>
        <div class="rating-options">
          <input type="radio" id="rate-1" name="rating" value="1"><label for="rate-1">1 ★</label>
          <input type="radio" id="rate-2" name="rating" value="2"><label for="rate-2">2 ★</label>
          <input type="radio" id="rate-3" name="rating" value="3"><label for="rate-3">3 ★</label>
          <input type="radio" id="rate-4" name="rating" value="4"><label for="rate-4">4 ★</label>
          <input type="radio" id="rate-5" name="rating" value="5"><label for="rate-5">5 ★</label>
        </div>
      </fieldset>
      <div class="form-group">
        <label for="review-comment">Comment (optional)</label>
        <textarea class="textarea" id="review-comment" name="comment" maxlength="1000"></textarea>
      </div>
      <div id="review-alert"></div>
      <div class="btn-group">
        <button type="submit" class="btn btn-primary">Submit review</button>
        <button type="button" class="btn btn-outline" data-close-dialog>Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="site-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/customer-dashboard.js"></script>
</body>
</html>
