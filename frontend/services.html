<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a professional · WorkSure</title>
  <meta name="description" content="Search verified home professionals by service, area, price and rating.">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="container page-top">
      <h1>Find a professional</h1>
      <p class="muted">Search verified professionals by service, area, price and rating.</p>
    </section>

    <div class="container services-layout">
      <form id="filter-form" class="card filter-form" aria-label="Filter professionals">
        <div class="form-group">
          <label for="q">Keyword</label>
          <input class="input" id="q" name="q" type="search" placeholder="e.g. plumber, deep cleaning">
        </div>
        <div class="form-group">
          <label for="categoryId">Category</label>
          <select class="select" id="categoryId" name="categoryId">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="form-group">
          <label for="location">Area or city</label>
          <input class="input" id="location" name="location" placeholder="e.g. Pune, Baner">
        </div>
        <div class="form-group">
          <label for="priceRange">Price range</label>
          <select class="select" id="priceRange" name="priceRange">
            <option value="">Any price</option>
            <option value="0-500">Under ₹500</option>
            <option value="500-1000">₹500 to ₹1,000</option>
            <option value="1000-2500">₹1,000 to ₹2,500</option>
            <option value="2500-">₹2,500 and above</option>
          </select>
        </div>
        <div class="form-group">
          <label for="minRating">Minimum rating</label>
          <select class="select" id="minRating" name="minRating">
            <option value="">Any rating</option>
            <option value="4">4 stars and up</option>
            <option value="4.5">4.5 stars and up</option>
          </select>
        </div>
        <div class="form-group">
          <label for="date">Available on</label>
          <input class="input" id="date" name="date" type="date">
          <p class="hint">Shows professionals who work on that weekday.</p>
        </div>
        <div class="checkbox-row form-group">
          <input id="available" name="available" type="checkbox">
          <label for="available">Only professionals taking new jobs now</label>
        </div>
        <div class="form-group">
          <label for="sort">Sort by</label>
          <select class="select" id="sort" name="sort">
            <option value="rating">Highest rated</option>
            <option value="price_asc">Lowest price</option>
            <option value="price_desc">Highest price</option>
            <option value="experience">Most experienced</option>
            <option value="newest">Newest members</option>
          </select>
        </div>
        <div class="btn-group">
          <button type="submit" class="btn btn-primary">Apply filters</button>
          <button type="button" id="filter-reset" class="btn btn-outline">Reset</button>
        </div>
      </form>

      <section class="results" aria-label="Search results">
        <p id="result-status" class="muted" aria-live="polite"></p>
        <div id="results-grid" class="grid-cards"></div>
        <div id="pagination" class="pagination"></div>
      </section>
    </div>

    <section class="container section">
      <div class="section-head">
        <h2>Browse services</h2>
        <p>Each service page lists the professionals who offer it.</p>
      </div>
      <div id="service-list" class="grid-cards"></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/services.js"></script>
</body>
</html>
